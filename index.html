<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drive AIFF Player</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="card">
    <div class="eyebrow">GOOGLE DRIVE</div>
    <h1>AIFF Player</h1>
    <div id="filename" class="filename">Drive AIFF Player</div>

    <audio id="player" controls hidden></audio>

    <button id="installButton">Google Driveにインストール</button>
    <button id="authButton" hidden>Google Driveへのアクセスを許可</button>

    <div id="status">初回のみ「Google Driveにインストール」を押してください。</div>

    <details>
      <summary>詳細</summary>
      <pre id="details"></pre>
    </details>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
