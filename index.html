<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIFF Player for Google Drive™</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="player-card">
      <header class="player-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <span>AIFF Player for Google Drive™</span>
        </div>
      </header>

      <div class="content-grid">
        <div class="artwork" aria-hidden="true">
          <div class="art-glow art-glow-a"></div>
          <div class="art-glow art-glow-b"></div>
          <div class="art-grain"></div>
        </div>
        <div class="track-info">
          <h1 id="filename">AIFF Player</h1>
          <p id="filemeta">AIFF</p>
        </div>
      </div>

      <div class="timeline">
        <input id="seek" class="range range-seek" type="range" min="0" max="1000" value="0" step="1" disabled aria-label="再生位置">
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="transport">
        <button id="back15" class="icon-button subtle" type="button" title="15秒戻る" disabled>↶</button>
        <button id="restart" class="icon-button" type="button" title="先頭へ" disabled>
          <span class="skip-icon skip-back" aria-hidden="true"></span>
        </button>
        <button id="playPause" class="play-button" type="button" title="再生" disabled>
          <span class="play-symbol" aria-hidden="true"></span>
        </button>
        <button id="forward15" class="icon-button" type="button" title="15秒進む" disabled>↷</button>
        <button id="mute" class="icon-button" type="button" title="ミュート" disabled>
          <span id="speakerIcon" aria-hidden="true">◖</span>
        </button>
      </div>

      <div class="volume-row">
        <span class="volume-symbol" aria-hidden="true">◖</span>
        <input id="volume" class="range" type="range" min="0" max="1" value="0.8" step="0.01" disabled aria-label="音量">
        <span id="remainingTime" class="remaining">-0:00</span>
      </div>

      <div id="status" class="status">Google Drive™ からAIFFを開いてください。</div>
      <audio id="audio" preload="metadata"></audio>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
