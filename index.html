<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIFF Player for Google Drive™</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="app">
    <section class="player">
      <header class="header">
        <div class="brand">
          <span class="brand-bars" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i>
          </span>
          <span>AIFF Player for Google Drive™</span>
        </div>
      </header>

      <div class="hero">
        <div class="artwork" aria-hidden="true">
          <span class="glow glow-a"></span>
          <span class="glow glow-b"></span>
          <span class="grain"></span>
        </div>

        <div class="track">
          <h1 id="filename">AIFF Player</h1>
          <p id="metadata">AIFF</p>
        </div>
      </div>

      <div class="timeline">
        <input id="seek" class="range" type="range"
               min="0" max="1000" value="0" step="1"
               aria-label="再生位置" disabled>
        <div class="times">
          <span id="elapsed">0:00</span>
          <span id="total">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="back15" class="small-control" type="button" title="15秒戻る" disabled>−15</button>
        <button id="restart" class="small-control" type="button" title="先頭へ" disabled>Ⅰ◀</button>

        <button id="play" class="play-control" type="button" aria-label="再生">
          <span class="play-shape" aria-hidden="true"></span>
        </button>

        <button id="forward15" class="small-control" type="button" title="15秒進む" disabled>+15</button>
        <button id="mute" class="small-control" type="button" title="ミュート" disabled>VOL</button>
      </div>

      <div class="volume-row">
        <span class="volume-label">VOL</span>
        <input id="volume" class="range" type="range"
               min="0" max="1" value="0.8" step="0.01"
               aria-label="音量" disabled>
        <span id="remaining" class="remaining">-0:00</span>
      </div>

      <div id="status" class="status">
        Google Drive™ からAIFFを開いてください。
      </div>

      <audio id="audio" preload="metadata"></audio>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
